# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: afetera/kernel_build_action@main
        with:
          kernel-url: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          kernel-branch: marble-s-oss
          config: marble_consolidate.config
          arch: arm64
          #aosp-gcc: true
          #aosp-clang: true
          #ksu: true
          #ksu-version: main
          android-version: 13
          #aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
