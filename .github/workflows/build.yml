# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: afetera/kernel_build_action@main
        with:
          kernel-url: https://github.com/afetera/android_kernel_xiaomi_marble
          kernel-branch: melt-rebase
          config: marble_defconfig
          arch: arm64
          #aosp-gcc: true
          #aosp-clang: true
          #ksu: true
          ksu-other: true
          ksu-url: https://github.com/ReSukiSU/ReSukiSU
          android-version: 13
          #aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
          extra-make-args: '["KBUILD_CFLAGS=-Wno-error"]'
